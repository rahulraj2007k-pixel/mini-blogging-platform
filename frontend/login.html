<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Mini Blog</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->
    <header class="navbar">

        <div class="container nav-container">

            <a href="index.html" class="logo">
                Mini Blog
            </a>

            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="login.html">
                    Login
                </a>

                <a href="register.html">
                    Register
                </a>

            </nav>

        </div>

    </header>


    <!-- =========================
         LOGIN SECTION
    ========================== -->
    <main>

        <section class="form-section">

            <div class="form-container">

                <h1>Welcome Back</h1>

                <p class="form-subtitle">
                    Login to manage and publish your blogs.
                </p>


                <!-- Login Form -->
                <form id="loginForm">

                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Login
                    </button>

                </form>


                <!-- Login Message -->
                <p id="loginMessage"></p>


                <!-- Register Link -->
                <p class="form-footer">

                    Don't have an account?

                    <a href="register.html">
                        Create an account
                    </a>

                </p>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="footer">

        <div class="container">

            <p>
                © 2026 Mini Blogging Platform
            </p>

        </div>

    </footer>


    <!-- JavaScript -->
    <script src="js/auth.js"></script>

</body>
</html>
