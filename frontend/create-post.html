<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Post - Mini Blog</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->
    <header class="navbar">

        <div class="container nav-container">

            <a href="index.html" class="logo">
                Mini Blog
            </a>

            <nav class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="create-post.html">
                    Create Post
                </a>

                <button id="logoutBtn" class="logout-btn">
                    Logout
                </button>

            </nav>

        </div>

    </header>


    <!-- =========================
         CREATE POST
    ========================== -->
    <main>

        <section class="form-section">

            <div class="form-container post-form-container">

                <h1>Create New Blog</h1>

                <p class="form-subtitle">
                    Share your thoughts and ideas with your readers.
                </p>


                <!-- =========================
                     POST FORM
                ========================== -->
                <form id="createPostForm">

                    <!-- Title -->
                    <div class="form-group">

                        <label for="title">
                            Blog Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            placeholder="Enter your blog title"
                            required
                        >

                    </div>


                    <!-- Category -->
                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select
                            id="category"
                            name="category"
                            required
                        >

                            <option value="">
                                Select Category
                            </option>

                            <option value="Technology">
                                Technology
                            </option>

                            <option value="Education">
                                Education
                            </option>

                            <option value="Programming">
                                Programming
                            </option>

                            <option value="Lifestyle">
                                Lifestyle
                            </option>

                            <option value="Travel">
                                Travel
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Featured Image -->
                    <div class="form-group">

                        <label for="featuredImage">
                            Featured Image URL
                            <span class="optional">
                                (Optional)
                            </span>
                        </label>

                        <input
                            type="url"
                            id="featuredImage"
                            name="featuredImage"
                            placeholder="https://example.com/image.jpg"
                        >

                    </div>


                    <!-- Content -->
                    <div class="form-group">

                        <label for="content">
                            Blog Content
                        </label>

                        <textarea
                            id="content"
                            name="content"
                            rows="12"
                            placeholder="Write your blog content here..."
                            required
                        ></textarea>

                    </div>


                    <!-- Status -->
                    <div class="form-group">

                        <label for="status">
                            Post Status
                        </label>

                        <select
                            id="status"
                            name="status"
                        >

                            <option value="published">
                                Publish Now
                            </option>

                            <option value="draft">
                                Save as Draft
                            </option>

                        </select>

                    </div>


                    <!-- Buttons -->
                    <div class="form-actions">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Create Post
                        </button>

                        <a
                            href="dashboard.html"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>


                <!-- Message -->
                <p id="postMessage"></p>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="footer">

        <div class="container">

            <p>
                © 2026 Mini Blogging Platform
            </p>

        </div>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->
    <script src="js/auth.js"></script>
    <script src="js/posts.js"></script>

</body>

</html>
